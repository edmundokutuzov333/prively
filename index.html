<!doctype html>
<html lang="pt-MZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10080b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Prively. O teu Privê digital." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Prively | O teu Privê digital.</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-shell" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-mark" aria-hidden="true">P</div>
        <div>
          <strong>Prively</strong>
          <span id="boot-message">A carregar a plataforma...</span>
        </div>
      </div>
    </div>
    <style>
      html,body,#root{min-height:100%}
      html,body{margin:0;background:#10080b;color:#f7f1f3}
      #boot-shell{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 20%,rgba(115,22,46,.22),transparent 42%),#10080b;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .boot-card{display:flex;align-items:center;gap:14px;max-width:420px;width:100%;padding:18px 20px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(24,12,16,.92);box-shadow:0 18px 60px rgba(0,0,0,.35)}
      .boot-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid rgba(230,62,104,.42);background:#431323;font-family:Georgia,serif;font-size:20px}
      .boot-card strong{display:block;font-size:14px;letter-spacing:-.01em}
      .boot-card span{display:block;margin-top:4px;font-size:13px;line-height:1.45;color:rgba(247,241,243,.62)}
      #boot-fallback{margin-top:10px}
      #boot-fallback button{min-height:42px;padding:0 14px;border:0;border-radius:10px;background:#c72e57;color:white;font-weight:600;cursor:pointer}
    </style>
    <script>
      window.setTimeout(function(){
        var shell=document.getElementById('boot-shell');
        var message=document.getElementById('boot-message');
        if(!shell || !message) return;
        message.textContent='A interface está a demorar mais do que o esperado.';
        if(!document.getElementById('boot-fallback')){
          var fallback=document.createElement('div');
          fallback.id='boot-fallback';
          fallback.innerHTML='<button type="button" onclick="location.reload()">Actualizar página</button>';
          var card=shell.querySelector('.boot-card');
          if(card) card.appendChild(fallback);
        }
      },12000);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
