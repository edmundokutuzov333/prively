name: Prively Production Delivery

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      supabase_ready: ${{ steps.config.outputs.supabase_ready }}
      vercel_ready: ${{ steps.config.outputs.vercel_ready }}
      health_ready: ${{ steps.config.outputs.health_ready }}
    steps:
      - id: config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PRIVELY_HEALTH_URL: ${{ secrets.PRIVELY_HEALTH_URL }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "supabase_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "supabase_ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "vercel_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "vercel_ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PRIVELY_HEALTH_URL" ]; then
            echo "health_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "health_ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-supabase:
    needs: prepare
    if: ${{ needs.prepare.outputs.supabase_ready == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Validate migrations
        run: supabase db lint
      - name: Push migrations
        run: supabase db push
      - name: Deploy Edge Functions
        run: supabase functions deploy --all
      - name: Record deployment metadata
        run: echo "Supabase deployment completed for $SUPABASE_PROJECT_REF"

  deploy-vercel:
    needs: prepare
    if: ${{ needs.prepare.outputs.vercel_ready == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

  post-deploy-health:
    needs: [prepare, deploy-supabase, deploy-vercel]
    if: ${{ always() && needs.prepare.outputs.health_ready == 'true' && (needs.deploy-supabase.result == 'success' || needs.deploy-supabase.result == 'skipped') && (needs.deploy-vercel.result == 'success' || needs.deploy-vercel.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Health check
        env:
          PRIVELY_HEALTH_URL: ${{ secrets.PRIVELY_HEALTH_URL }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 "$PRIVELY_HEALTH_URL"

  delivery-status:
    needs: [prepare, deploy-supabase, deploy-vercel, post-deploy-health]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate delivery
        env:
          SUPABASE_RESULT: ${{ needs.deploy-supabase.result }}
          VERCEL_RESULT: ${{ needs.deploy-vercel.result }}
          HEALTH_RESULT: ${{ needs.post-deploy-health.result }}
        run: |
          if [ "$SUPABASE_RESULT" = "failure" ] || [ "$SUPABASE_RESULT" = "cancelled" ]; then
            exit 1
          fi
          if [ "$VERCEL_RESULT" = "failure" ] || [ "$VERCEL_RESULT" = "cancelled" ]; then
            exit 1
          fi
          if [ "$HEALTH_RESULT" = "failure" ] || [ "$HEALTH_RESULT" = "cancelled" ]; then
            exit 1
          fi
          echo "Production delivery workflow completed. Provider deployment is skipped when its secrets are not configured."
