name: Streamtape Real Evidence

on:
  push:
    branches:
      - streamtape-certification

permissions:
  contents: read

concurrency:
  group: streamtape-real-evidence
  cancel-in-progress: true

jobs:
  real-evidence:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://gaonupelgtpfthouyobh.supabase.co
      SUPABASE_PROJECT_REF: gaonupelgtpfthouyobh
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_nOlc5uc4GLZQzLTYpytHwA_mhlPtPcK
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install static ffmpeg
        run: npm install --no-save --package-lock=false ffmpeg-static

      - name: Validate runner tools
        shell: bash
        run: |
          command -v jq
          command -v node
          jq --version
          node --version

      - name: Install Supabase CLI
        run: npm install --no-save --package-lock=false supabase@2.118.0

      - name: Validate required secrets are available
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Run real Streamtape evidence
        shell: bash
        run: |
          chmod +x scripts/streamtape-real-evidence.sh
          scripts/streamtape-real-evidence.sh

      - name: Upload Streamtape evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamtape-real-evidence
          path: artifacts/streamtape
          if-no-files-found: warn
          retention-days: 14
