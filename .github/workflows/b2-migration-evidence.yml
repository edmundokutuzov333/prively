name: B2 migration evidence

on:
  push:

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Execute real migration evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --retry 2 --connect-timeout 15 -w '\nHTTP_STATUS:%{http_code}\n' "https://gaonupelgtpfthouyobh.supabase.co/functions/v1/health?nonce=b2-migration-real-20260930" | tee /tmp/b2-migration-evidence.raw
          python - <<'PY'
          import json
          raw=open("/tmp/b2-migration-evidence.raw","r",encoding="utf-8").read()
          print(raw)
          payload, status = raw.rsplit("\nHTTP_STATUS:",1)
          assert status.strip() == "200", raw
          data=json.loads(payload)
          print(json.dumps(data, indent=2))
          assert data["ok"] is True, data
          assert len(data["syntheticInput"]) == 6, data
          assert data["postCleanupListObjectsV2"]["KeyCount"] == 0, data
          PY
