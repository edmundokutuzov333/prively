name: Prively CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prively-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check migrations
        run: npm run check:migrations
      - name: Check Supabase function gateway configuration
        run: npm run check:supabase-config
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production source audit
        run: npm run audit:production
      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild database from zero
        run: supabase db reset
      - name: Validate migrations and database lint
        run: supabase db lint --local
      - name: Run canonical database suite
        id: canonical_db
        continue-on-error: true
        run: supabase test db
      - name: Run raw SQL native regression suites
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -P pager=off -f supabase/tests/database/phase6_financial_core_native_test.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -P pager=off -f supabase/tests/database/creator_terms_native_test.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -P pager=off -f supabase/tests/database/spec_alignment_native_test.sql
      - name: Evaluate canonical database suite
        if: ${{ always() }}
        run: |
          if [ "${{ steps.canonical_db.outcome }}" != "success" ]; then
            echo "supabase test db failed; native suites above provide the isolated regression signal."
            exit 1
          fi
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E and accessibility checks
        run: npm run e2e
