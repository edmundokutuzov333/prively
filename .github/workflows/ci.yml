name: Prively CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prively-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check migrations
        run: npm run check:migrations
      - name: Check Supabase function gateway configuration
        run: npm run check:supabase-config
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production source audit
        run: npm run audit:production
      - name: Build
        run: npm run build

  edge_functions:
    name: Edge Functions contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Edge Function and shared contract tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find supabase/functions -type f \( -name '*.test.ts' -o -name '*.spec.ts' \) | sort)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No Deno tests found"
            exit 1
          fi
          deno test --config supabase/functions/deno.json --allow-env --allow-read --allow-net "${tests[@]}"

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild database from zero
        run: supabase db reset
      - name: Validate migrations and database lint
        run: supabase db lint --local
      - name: Run canonical database suite
        id: canonical_db
        continue-on-error: true
        run: |
          supabase test db \
            supabase/tests/database/phase3_test.sql \
            supabase/tests/database/phase4_function_security_test.sql \
            supabase/tests/database/phase4_identity_security_test.sql \
            supabase/tests/database/phase5_content_media_test.sql \
            supabase/tests/database/phase5_hardening_test.sql \
            supabase/tests/database/phase5_hardening_test_v2.sql \
            supabase/tests/database/phase5_storage_security_test.sql \
            supabase/tests/database/phase6_financial_core_test.sql \
            supabase/tests/database/phase10_security_contract_test.sql
      - name: Run native SQL regression suites
        shell: bash
        run: |
          set -u
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          failures=0
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap;"
          run_suite() {
            local name="$1"
            local file="$2"
            echo "===== NATIVE SUITE: $name ====="
            set +e
            PGOPTIONS="-c search_path=public,extensions,pg_catalog" psql "$DB_URL" -v ON_ERROR_STOP=1 -P pager=off -f "$file"
            local status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "FAILED: $name (exit $status)"
              failures=$((failures + 1))
            else
              echo "PASSED: $name"
            fi
          }

          suites=(
            "phase3_test.sql"
            "phase4_function_security_test.sql"
            "phase4_identity_security_test.sql"
            "phase5_content_media_test.sql"
            "phase5_hardening_test_v2.sql"
            "phase5_storage_security_test.sql"
            "phase6_financial_core_test.sql"
            "phase6_financial_core_native_test.sql"
            "phase7_social_realtime_test.sql"
            "phase8_safety_moderation_meetings_test.sql"
            "phase9_business_engine_test.sql"
            "phase10_production_hardening_test.sql"
            "phase10_security_contract_test.sql"
            "phase10_sensitive_access_aal2_test.sql"
            "creator_terms_native_test.sql"
            "spec_alignment_native_test.sql"
          )

          for file in "${suites[@]}"; do
            run_suite "$file" "supabase/tests/database/$file"
          done

          if [ "$failures" -ne 0 ]; then
            echo "Native SQL suites failed: $failures"
            exit 1
          fi
      - name: Evaluate canonical database suite
        if: ${{ always() }}
        run: |
          if [ "${{ steps.canonical_db.outcome }}" != "success" ]; then
            echo "supabase test db failed; native suites above provide the isolated regression signal."
            exit 1
          fi
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup


  b2_real_assets:
    name: Upload real B2 raster assets
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Generate real PNG JPEG and WebP files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          import base64, json
          from pathlib import Path

          out = Path("/tmp/prively-raster")
          out.mkdir(parents=True, exist_ok=True)

          W, H = 900, 600
          img = Image.new("RGB", (W, H))
          px = img.load()
          for y in range(H):
              for x in range(W):
                  px[x, y] = (
                      25 + int(170 * x / W),
                      55 + int(125 * y / H),
                      95 + int(120 * (1 - x / W)),
                  )

          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle((55, 55, W-55, H-55), radius=32, outline="white", width=6, fill=(16, 20, 28))
          draw.text((110, 180), "PRIVELY", fill="white")
          draw.text((110, 250), "REAL B2 RASTER ASSET", fill="white")
          draw.text((110, 320), "2026-09-30", fill="white")

          files = []
          png = out / "prively-real.png"
          jpg = out / "prively-real.jpg"
          webp = out / "prively-real.webp"

          img.save(png, "PNG")
          img.save(jpg, "JPEG", quality=92)
          img.save(webp, "WEBP", quality=90)

          for path, mime in [
              (png, "image/png"),
              (jpg, "image/jpeg"),
              (webp, "image/webp"),
          ]:
              files.append({
                  "name": path.name,
                  "contentType": mime,
                  "bytesBase64": base64.b64encode(path.read_bytes()).decode("ascii")
              })

          payload = {"assets": files}
          Path("/tmp/prively-raster.json").write_text(json.dumps(payload))
          print(json.dumps({
              "generated": [
                  {"name": x["name"], "contentType": x["contentType"], "bytes": len(base64.b64decode(x["bytesBase64"]))}
                  for x in files
              ]
          }, indent=2))
          PY

      - name: Upload real raster files to B2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --connect-timeout 20             -X POST             -H "content-type: application/json"             --data-binary @/tmp/prively-raster.json             "https://gaonupelgtpfthouyobh.supabase.co/functions/v1/b2-smoke-test?nonce=prively-real-raster-2026-09-30-9ab2"             | tee /tmp/b2-raster-response.json
          python - <<'PY'
          import json
          with open("/tmp/b2-raster-response.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          assert data["ok"] is True, data
          assert len(data["objects"]) == 3, data
          wanted = {
              "prively-real.png": "image/png",
              "prively-real.jpg": "image/jpeg",
              "prively-real.webp": "image/webp",
          }
          for obj in data["objects"]:
              assert obj["bytes"] > 0, obj
              assert obj["contentType"] == wanted[obj["key"].split("/")[-1]], obj
          print(json.dumps(data, indent=2))
          PY

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: quality
    env:
      VITE_SUPABASE_URL: https://gaonupelgtpfthouyobh.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nOlc5uc4GLZQzLTYpytHwA_mhlPtPcK
      VITE_APP_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start local Supabase
        run: supabase start
      - name: Reset local database
        run: supabase db reset
      - name: Export local E2E environment
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
          } >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E and accessibility checks
        run: npm run e2e
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
