name: One-time B2 Raster Assets

on:
  push:
    branches:
      - main

jobs:
  upload-raster:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Generate real PNG JPEG and WebP files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          import base64, json
          from pathlib import Path
          out = Path("/tmp/prively-raster")
          out.mkdir(parents=True, exist_ok=True)
          W, H = 900, 600
          img = Image.new("RGB", (W, H))
          px = img.load()
          for y in range(H):
              for x in range(W):
                  px[x, y] = (
                      25 + int(170 * x / W),
                      55 + int(125 * y / H),
                      95 + int(120 * (1 - x / W)),
                  )
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle((55,55,W-55,H-55), radius=32, outline="white", width=6, fill=(16,20,28))
          draw.text((110,180), "PRIVELY", fill="white")
          draw.text((110,250), "REAL B2 RASTER ASSET", fill="white")
          draw.text((110,320), "2026-09-30", fill="white")
          items=[]
          files=[
              (out/"prively-real.png","image/png","PNG"),
              (out/"prively-real.jpg","image/jpeg","JPEG"),
              (out/"prively-real.webp","image/webp","WEBP"),
          ]
          img.save(files[0][0], "PNG")
          img.save(files[1][0], "JPEG", quality=92)
          img.save(files[2][0], "WEBP", quality=90)
          for path,mime,label in files:
              items.append({"name":path.name,"contentType":mime,"bytesBase64":base64.b64encode(path.read_bytes()).decode("ascii")})
          Path("/tmp/raster.json").write_text(json.dumps({"assets":items}))
          print(json.dumps([{"name":x["name"],"contentType":x["contentType"],"bytes":len(base64.b64decode(x["bytesBase64"]))} for x in items], indent=2))
          PY
      - name: Upload and verify raster files in B2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --connect-timeout 20             -X POST             -H "content-type: application/json"             --data-binary @/tmp/raster.json             "https://gaonupelgtpfthouyobh.supabase.co/functions/v1/b2-smoke-test?nonce=prively-real-raster-2026-09-30-9ab2"             | tee /tmp/b2-raster.json
          python - <<'PY'
          import json
          with open("/tmp/b2-raster.json","r",encoding="utf-8") as f:
              data=json.load(f)
          assert data["ok"] is True, data
          expected={
              "prively-real.png":"image/png",
              "prively-real.jpg":"image/jpeg",
              "prively-real.webp":"image/webp"
          }
          assert len(data["objects"])==3, data
          for obj in data["objects"]:
              name=obj["key"].split("/")[-1]
              assert obj["bytes"]>0, obj
              assert obj["contentType"]==expected[name], obj
          print(json.dumps(data, indent=2))
          PY
