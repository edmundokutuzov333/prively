name: Streamtape live E2E evidence

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://gaonupelgtpfthouyobh.supabase.co
      SUPABASE_KEY: sb_publishable_nOlc5uc4GLZQzLTYpytHwA_mhlPtPcK
      TEST_PASSWORD: test
      CREATOR_EMAIL: criadora.teste@prively.test
      CLIENT_EMAIL: cliente.teste@prively.test
      ASSET_ID: 0ed4bf87-b547-48e2-a881-45dda180b72c

    steps:
      - name: Authenticate creator
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg email "$CREATOR_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password}')"
          response="$(curl -sS -w '
HTTP_STATUS=%{http_code}'             "$SUPABASE_URL/auth/v1/token?grant_type=password"             -H "apikey: $SUPABASE_KEY"             -H 'Content-Type: application/json'             --data "$payload")"
          echo "$response"
          body="$(printf '%s
' "$response" | sed '$d')"
          status="$(printf '%s
' "$response" | tail -n1 | cut -d= -f2)"
          test "$status" = "200"
          echo "CREATOR_TOKEN=$(printf '%s' "$body" | jq -r '.access_token')" >> "$GITHUB_ENV"

      - name: Real Remote Upload
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg asset "$ASSET_ID" '{asset_id:$asset}')"
          response="$(curl -sS -w '
HTTP_STATUS=%{http_code}' -X POST             "$SUPABASE_URL/functions/v1/streamtape-remote-upload"             -H "apikey: $SUPABASE_KEY"             -H "Authorization: Bearer $CREATOR_TOKEN"             -H 'Content-Type: application/json'             --data "$payload")"
          echo "$response"
          status="$(printf '%s
' "$response" | tail -n1 | cut -d= -f2)"
          test "$status" = "200"

      - name: Real status polling
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            payload="$(jq -nc --arg asset "$ASSET_ID" '{asset_id:$asset}')"
            response="$(curl -sS -w '
HTTP_STATUS=%{http_code}' -X POST               "$SUPABASE_URL/functions/v1/streamtape-check-status"               -H "apikey: $SUPABASE_KEY"               -H "Authorization: Bearer $CREATOR_TOKEN"               -H 'Content-Type: application/json'               --data "$payload")"
            echo "POLL_ATTEMPT=$attempt"
            echo "$response"
            body="$(printf '%s
' "$response" | sed '$d')"
            status="$(printf '%s
' "$response" | tail -n1 | cut -d= -f2)"
            test "$status" = "200"
            state="$(printf '%s' "$body" | jq -r '.status')"
            if [ "$state" = "ready" ]; then
              echo "STREAMTAPE_STATUS_READY=true"
              exit 0
            fi
            sleep 15
          done
          echo "STREAMTAPE_STATUS_READY=false"
          exit 1

      - name: Authenticate client
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg email "$CLIENT_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password}')"
          response="$(curl -sS -w '
HTTP_STATUS=%{http_code}'             "$SUPABASE_URL/auth/v1/token?grant_type=password"             -H "apikey: $SUPABASE_KEY"             -H 'Content-Type: application/json'             --data "$payload")"
          echo "$response"
          body="$(printf '%s
' "$response" | sed '$d')"
          status="$(printf '%s
' "$response" | tail -n1 | cut -d= -f2)"
          test "$status" = "200"
          echo "CLIENT_TOKEN=$(printf '%s' "$body" | jq -r '.access_token')" >> "$GITHUB_ENV"

      - name: Authorized playback
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg asset "$ASSET_ID" '{asset_id:$asset}')"
          response="$(curl -sS -w '
HTTP_STATUS=%{http_code}' -X POST             "$SUPABASE_URL/functions/v1/get-video-playback-url"             -H "apikey: $SUPABASE_KEY"             -H "Authorization: Bearer $CLIENT_TOKEN"             -H 'Content-Type: application/json'             --data "$payload")"
          echo "$response"
          body="$(printf '%s
' "$response" | sed '$d')"
          status="$(printf '%s
' "$response" | tail -n1 | cut -d= -f2)"
          test "$status" = "200"
          printf '%s' "$body" | jq -e '.ok == true and (.embed_url | startswith("https://streamtape.com/e/"))' >/dev/null
          echo "AUTHORIZED_PLAYBACK_HTTP_STATUS=$status"
