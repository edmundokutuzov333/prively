name: Streamtape CLI Deploy Evidence

on:
  push:
    branches:
      - streamtape-certification

permissions:
  contents: read

concurrency:
  group: streamtape-cli-deploy-evidence
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"
          echo "Supabase deployment secrets are available to this repository workflow."

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy streamtape-remote-upload
        run: |
          set -o pipefail
          supabase functions deploy streamtape-remote-upload --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee artifacts-streamtape-remote-upload.txt

      - name: Deploy streamtape-check-status
        run: |
          set -o pipefail
          supabase functions deploy streamtape-check-status --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee artifacts-streamtape-check-status.txt

      - name: Deploy get-video-playback-url
        run: |
          set -o pipefail
          supabase functions deploy get-video-playback-url --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee artifacts-get-video-playback-url.txt

      - name: Upload literal deploy output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamtape-cli-deploy-output
          path: artifacts-*.txt
          if-no-files-found: warn
          retention-days: 14
