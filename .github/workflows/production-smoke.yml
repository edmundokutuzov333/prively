name: Prively Production Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_APP_ENV: production
      PLAYWRIGHT_BASE_URL: https://prively.vercel.app
      PRIVELY_PRODUCTION_URL: https://prively.vercel.app
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run production smoke
        run: npx playwright test tests/e2e/production-smoke.spec.ts --reporter=list
