name: Streamtape live embed evidence

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  streamtape-curl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe real Streamtape embed
        shell: bash
        run: |
          set -euo pipefail
          url='https://streamtape.com/e/l4Ggw0BJbzhZYr'
          code="$(curl -L -sS -o /tmp/streamtape-embed.html -w '%{http_code}' "$url")"
          bytes="$(wc -c < /tmp/streamtape-embed.html | tr -d ' ')"
          echo "STREAMTAPE_EMBED_HTTP_STATUS=$code"
          echo "STREAMTAPE_EMBED_BYTES=$bytes"
          test "$code" = "200"
          test "$bytes" -gt 0
