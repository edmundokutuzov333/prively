name: Prively Phase 14 Finance Admin CI

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/database/phase14_payouts_admin_test.sql'
      - '.github/workflows/phase14-finance-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase14_database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild database from zero
        run: supabase db reset
      - name: Run Phase 14 payout/admin suite
        run: supabase test db supabase/tests/database/phase14_payouts_admin_test.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
