[functions.media-advanced-process]
verify_jwt = true
[functions.moderation-scan]
verify_jwt = true
[functions.order-shipping-access]
verify_jwt = true
[functions.payments-create-topup]
verify_jwt = true
[functions.payout-process]
verify_jwt = true
[functions.process-media-job]
